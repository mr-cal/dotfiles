# shell
# -----
shell                      fish
shell_integration          enabled
notify_on_cmd_finish       unfocused 10


# scrolling
# ---------
scrollbar                      scrolled
scrollback_lines               1000000
scrollback_pager_history_size  1000
scrollbar_handle_opacity       0.6
momentum_scroll                0.96
pixel_scroll                   yes
allow_remote_control           socket-only


# cursor
# ------
cursor_blink_interval          3
cursor_stop_blinking_after     15
mouse_hide_wait                -1
disable_ligatures              cursor
cursor_trail                   200
cursor_trail_decay             0.05 0.4
cursor_trail_start_threshold   7


# copying and mouse
# -----------------
copy_on_select                  yes
strip_trailing_spaces           smart
show_hyperlink_targets          yes
mouse_map right press ungrabbed paste_from_selection


# tabs and windows
# ----------------
enabled_layouts               splits,stack
tab_bar_edge                  top
tab_bar_style                 powerline
tab_powerline_style           angled
tab_bar_min_tabs              2
inactive_text_alpha           0.85
window_padding_width          4
confirm_os_window_close       -1


# font
# ----
font_family      family="Ubuntu Sans Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# for nerd fonts, from https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono


# shortcuts
# ---------
map kitty_mod+enter launch --cwd=current

# Splits layout — physical Fn key grid:
#
#   F12  │  F7  │  F8  │  F9
#   F11  │  F4  │  F5  │  F6
#   F10  │  F1  │  F2  │  F3
#
#    -   │  rot │  ↑   │  -
#    -   │  ←   │  ↓   │  →
#    -   │ smrt │  ⇔   │  ⇕
#
# ⇧ + nav key (F4/F5/F6/F8) = move pane in that direction
map f1 launch --location=split  --cwd=current
map f2 launch --location=vsplit --cwd=current
map f3 launch --location=hsplit --cwd=current

map f4 neighboring_window left
map f5 neighboring_window down
map f6 neighboring_window right
map f8 neighboring_window up

map shift+f4 move_window left
map shift+f5 move_window down
map shift+f6 move_window right
map shift+f8 move_window up

map f7 layout_action rotate


# theme
# -----
include current-theme.conf
